name: Test Workflow with Coverage

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'chat-app/backend/**/*.py'
      - 'scenario-app/backend/**/*.py'
      - '.flake8'
      - '.github/workflows/tests.yaml'
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    branches:
      - main
      - dev
    paths:
      - 'chat-app/backend/**/*.py'
      - 'scenario-app/backend/**/*.py'
      - '.github/workflows/tests.yaml'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  backend_tests:
    name: Backend Tests
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Set up Python environment for Backend
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"  # Set Python version

      - name: Install Backend Dependencies
        run: |
          python -m pip install -r chat-app/backend/requirements.txt
          python -m pip install -r scenario-app/backend/requirements.txt

      - name: Run Backend Tests with Coverage
        run: |
          CHAT_APP_BACKEND="chat-app/backend"
          SCENARIO_APP_BACKEND="scenario-app/backend"
          TEST_DIRS=()
          COV_FLAGS=()
          [ -d "$CHAT_APP_BACKEND/tests" ] && TEST_DIRS+=("$CHAT_APP_BACKEND/tests")
          [ -d "$SCENARIO_APP_BACKEND/tests" ] && TEST_DIRS+=("$SCENARIO_APP_BACKEND/tests")
          [ -d "$CHAT_APP_BACKEND/app" ] && COV_FLAGS+=("--cov=$CHAT_APP_BACKEND/app")
          [ -d "$SCENARIO_APP_BACKEND/app" ] && COV_FLAGS+=("--cov=$SCENARIO_APP_BACKEND/app")
          if [ ${#TEST_DIRS[@]} -eq 0 ]; then
            echo "No test directories found, skipping tests."
          elif python -m pytest \
              ${COV_FLAGS[@]:+"${COV_FLAGS[@]}"} \
              --cov-report=xml:coverage.xml --cov-report=html:htmlcov \
              --cov-report=term-missing --junitxml=coverage-junit.xml "${TEST_DIRS[@]}"; then
            echo "Tests completed, checking coverage."
            # Only fail if coverage does not meet criteria
            if [ -f coverage.xml ]; then
              COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); coverage = float(root.attrib['line-rate']) * 100; print(coverage)")
              if (( $(echo "$COVERAGE < 80" | bc -l) )); then
                echo "Coverage is below 80% ($COVERAGE%), failing the job."
                exit 1
              else
                echo "Coverage is $COVERAGE%, meeting the threshold."
              fi
            fi
          else
            echo "No tests found, skipping coverage check."
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: |
            coverage.xml
            coverage-junit.xml
            htmlcov/

      - name: Pytest Coverage Comment
        if: |
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == false
        uses: MishaKav/pytest-coverage-comment@dd5b80bde6d16941f336518e92929e89069d8451  # v1.7.2
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: coverage-junit.xml
          report-only-changed-files: true