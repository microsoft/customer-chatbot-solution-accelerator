name: PyLint

on:
  push:
    paths:
      - 'chat-app/backend/**/*.py'
      - 'scenario-app/backend/**/*.py'
      - 'infra/scripts/**/*.py'
      - '.flake8'
      - '.github/workflows/pylint.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r chat-app/backend/requirements.txt --no-cache-dir
          pip install -r scenario-app/backend/requirements.txt --no-cache-dir
      
      - name: Run flake8 and pylint
        run: |
          flake8 --config=.flake8 chat-app/backend scenario-app/backend infra/scripts